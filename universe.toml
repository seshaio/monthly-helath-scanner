# --------------------------------------------------------------------------
# Corporate actions the feed got wrong
# --------------------------------------------------------------------------
# Detection is automatic; correction is deliberate. The run flags any single
# session move too large to be a market event, and refuses to score that name
# until a human says what actually happened. Nothing is auto-repaired —
# silently rescaling history is how a confident wrong report gets produced.
#
# Verify each one against the issuer's own disclosure before adding it.
#
#   [[split]]     prices BEFORE `date` are divided by `ratio`
#   [[bad_print]] that single session is dropped from the series

# Both found by the integrity guard on the first live run, 2026-08-21.
# yfinance reports no split for either, so auto_adjust did nothing.

# 1655 was flagged as a 10:1 split by ratio, but the series returns to its
# old level two sessions later — so these are bad prints, not a split.
# Verified by inspection: ~342 before, 33.96 / 35.76, then ~361 after.
[[bad_print]]
code = "1655"
date = "2022-02-08"
note = "Printed 33.96 against a ~342 series"

[[bad_print]]
code = "1655"
date = "2022-02-09"
note = "Printed 35.76 against a ~342 series; recovered 2022-02-10"

[[split]]
code = "2559"
date = "2026-06-05"
ratio = 10
note = "MAXIS ACWI — 1:10 split, absent from the feed's split table"

[[bad_print]]
code = "2559"
date = "2026-06-08"
note = "Printed 299.6 against a ~3000 series; recovered next session"

# --------------------------------------------------------------------------
# Declared assumptions
# --------------------------------------------------------------------------
# A thesis that changes how a name is scored, stated out loud instead of
# leaking silently into a threshold. Each one is dated, applied mechanically,
# and shows up labelled in the report — so when the thesis dies, deleting one
# block restores the base rules and the delta shows what it was worth.

[[assumption]]
code = "315A"
field = "reference_pe"
value = 13.0
date = "2026-08-21"
note = "BOJ normalization: policy rate 0.75% and rising; bank NIMs expand in a positive-rate regime, so the justified multiple sits above the zero-rate era's 11x"

# --------------------------------------------------------------------------
# Verified feed corrections
# --------------------------------------------------------------------------
# A point-in-time human check that a specific feed field is wrong, as
# opposed to a corporate action ([[split]]) or a bad tick ([[bad_print]]).
# NAV moves daily, so this does not try to "correct" the field going
# forward — it only proves the feed's navPrice is untrustworthy for this
# fund and silences the premium/discount flag it produces, with the
# verification on record for when someone next wants to re-check it.

[[nav_verification]]
code = "315A"
verified_nav = 1871.104
verified_at = "2026-08-21T15:30:00+09:00"
source = "issuer site"
note = "Feed's navPrice (1,951.87) was stale by ~4.3%. True price-vs-NAV gap was +0.07%, not the flagged -3.7%. The premium/discount note is a feed artefact for this name and is suppressed accordingly."
