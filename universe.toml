# The list under review.
#
# This is the one file you are expected to edit routinely. Add or remove a
# ticker here and nothing else changes — no code edit, no threshold change.
#
# Keep it separate from config.py on purpose: the *list* is allowed to move,
# the *rules* are not. A month where both changed is uninterpretable, because
# you cannot tell whether a verdict moved because the company did or because
# you moved the goalposts.
#
#   code   TSE ticker. Quote it — some are alphanumeric ("315A") and some have
#          leading zeros, both of which a bare TOML number would destroy.
#   held   true if you own it, false to watch it without owning it.
#   note   free text, for you. Never read by the code.
#   fx     ETFs only. "usd_unhedged" | "usd_hedged" | "jpy". Feeds the
#          portfolio FX exposure calculation.

